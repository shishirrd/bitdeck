name: Windows checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev-lock.txt
      - name: Regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Check package metadata
        run: python -m pip install --no-deps -e .
      - name: Install locked Windows build tools
        run: python -m pip install --require-hashes -r requirements-build-lock.txt
      - name: Build standalone executable
        run: python scripts/build_windows.py
      - name: Verify packaged app without Python on PATH
        run: python scripts/verify_windows.py
      - name: Collect portable download
        run: python scripts/package_windows.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BitDeck-Windows-x64
          path: |
            windows/BitDeck.exe
            windows/BitDeck-Windows.zip
            windows/SHA256SUMS.txt
            windows/packaged-check.json
