[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitdeck-desktop"
version = "0.3.0"
description = "Drag a file, press Shift, and convert or edit images, PDFs and text."
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.8,<7", "Pillow>=12.1.1,<13", "pypdf[crypto]>=6.21.1,<7", "pypdfium2>=4.30,<6", "reportlab>=4,<5"]
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
bitdeck = "bitdeck.desktop:main"

[tool.setuptools.packages.find]
include = ["bitdeck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
